# The @argszero/cordis-plugin-repeat-guard-escalation bundle patch: mount and go.
#
# Pair it with the shipped guard, which stays advisory and keeps explaining
# itself. This plugin adds the consequence once advice has been ignored: from
# `escalateAt` (default 9 — one past the shipped guard's highest reminder
# threshold of 8), a repeated call is denied BEFORE dispatch.
#
# The shipped guard records this as a known gap in its own README:
#   "Advisory only — escalating to a blocking form at a high threshold is not
#    implemented, though `PostToolDecision` already supports blocking."
# and separately:
#   "Past the highest threshold a chain goes silent"
# — so with the default [3, 5, 8] reminders, the 9th and later identical calls
# draw no reminder at all. This plugin covers exactly that window.
#
# Optional config:
#
#   - set:
#       - id: repeat-guard-escalation
#         config:
#           escalateAt: 9      # deny from the 9th consecutive identical call
#           maxDenials: 3      # then step aside, so the session can finish
#           exclude: [todo_write]
#
# Enforcement is deliberately bounded: after `maxDenials` the guard steps aside
# permanently for that chain and calls proceed. Denying forever would make a
# looping session unfinishable, which is worse than the loop.
#
# A user message clears every chain, and a different call resets the chain —
# only consecutive identical calls (same tool, same canonical arguments) can
# reach the threshold.

- insert:
    - id: repeat-guard-escalation
      name: '@argszero/cordis-plugin-repeat-guard-escalation'
